<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="100%" role="img" aria-label="타이머가 없으면 A가 죽었을 때 영원히 멈추고, 타이머가 있으면 느릴 뿐인 A의 라운드를 끊어 진행이 막히는 딜레마" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="760" height="580" fill="#ffffff"/>

  <line x1="380" y1="20" x2="380" y2="510" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 머리글 -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">
    <rect x="30" y="20" width="320" height="44" rx="10" fill="#f6f7f8" stroke="#6b7280" stroke-width="2"/>
    <text x="190" y="48">기다린다 (타이머 없음)</text>
    <rect x="410" y="20" width="320" height="44" rx="10" fill="#f6f7f8" stroke="#6b7280" stroke-width="2"/>
    <text x="570" y="48">재시도한다 (타이머 있음)</text>
  </g>

  <!-- 시나리오 라벨 -->
  <g font-size="15" font-weight="700" fill="#4b5563">
    <text x="30" y="98">A가 죽은 경우</text>
    <text x="410" y="98">A가 죽은 경우</text>
    <text x="30" y="322">A가 느릴 뿐인 경우</text>
    <text x="410" y="322">A가 느릴 뿐인 경우</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1.5"><line x1="30" y1="296" x2="730" y2="296"/></g>

  <!-- 왼쪽 위: 죽은 경우 -->
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <rect x="30" y="112" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="190" y="138">A가 라운드 도중에 죽는다</text>
    <rect x="30" y="172" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="190" y="198">B는 기다리기만 한다</text>
    <rect x="30" y="232" width="320" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
    <text x="190" y="261" font-weight="700" fill="#c0392b">아무도 이어받지 못해 영원히 멈춤</text>
  </g>
  <line x1="190" y1="154" x2="190" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="190" y1="214" x2="190" y2="230" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 오른쪽 위: 죽은 경우 -->
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <rect x="410" y="112" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="570" y="138">B의 타이머가 울린다</text>
    <rect x="410" y="178" width="320" height="42" rx="8" fill="#fdf1e3" stroke="#d9822b" stroke-width="2"/>
    <text x="570" y="204" font-weight="700">B가 이어받아 결정한다</text>
  </g>
  <line x1="570" y1="154" x2="570" y2="176" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="570" y="254" font-size="14" fill="#6b7280" text-anchor="middle">타이머가 죽은 서버를 대신해 준다</text>

  <!-- 왼쪽 아래: 느린 경우 -->
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <rect x="30" y="332" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="190" y="358">A가 끝낼 때까지 기다린다</text>
    <rect x="30" y="398" width="320" height="42" rx="8" fill="#e8f0fc" stroke="#2f6fdb" stroke-width="2"/>
    <text x="190" y="424" font-weight="700">방해 없이 결정한다</text>
  </g>
  <line x1="190" y1="374" x2="190" y2="396" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- 오른쪽 아래: 느린 경우 -->
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <rect x="410" y="332" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="570" y="358">타이머가 울린다 (A는 살아 있다)</text>
    <rect x="410" y="398" width="320" height="42" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="570" y="424">A의 진행 중인 라운드가 끊긴다</text>
    <rect x="410" y="464" width="320" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
    <text x="570" y="493" font-weight="700" fill="#c0392b">되풀이되면 진행이 막힌다</text>
  </g>
  <line x1="570" y1="374" x2="570" y2="396" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="570" y1="440" x2="570" y2="462" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 결론 -->
  <text x="190" y="470" font-size="14" fill="#6b7280" text-anchor="middle">방해는 없지만 죽은 서버를 대신해 줄 수 없다</text>
  <text x="380" y="556" font-size="15" fill="#4b5563" text-anchor="middle">죽은 서버와 느린 서버는 구분되지 않으므로 어느 쪽을 택해도 막힐 수 있다</text>
</svg>
