<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" role="img" aria-label="두 제안자가 번갈아 더 높은 번호로 Prepare를 보내 서로의 Accept를 거절당하게 만드는 livelock" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#2f6fdb"/></marker>
    <marker id="ao" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#d9822b"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker>
    <style>
      .h { paint-order: stroke; stroke: #ffffff; stroke-width: 9; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>

  <!-- 생명선 -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="190" y1="62" x2="190" y2="470"/>
    <line x1="400" y1="62" x2="400" y2="470"/>
    <line x1="610" y1="62" x2="610" y2="470"/>
  </g>

  <!-- 머리글 -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328" stroke-width="2">
    <rect x="140" y="22" width="100" height="40" rx="8" fill="#e8f0fc" stroke="#2f6fdb"/>
    <text x="190" y="48">P1 (값 A)</text>
    <rect x="335" y="22" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7280"/>
    <text x="400" y="48">수락자들</text>
    <rect x="560" y="22" width="100" height="40" rx="8" fill="#fdf1e3" stroke="#d9822b"/>
    <text x="610" y="48">P2 (값 B)</text>
  </g>

  <!-- 단계 구분선과 번호 -->
  <g stroke="#e5e7eb" stroke-width="1.5">
    <line x1="20" y1="165" x2="740" y2="165"/>
    <line x1="20" y1="270" x2="740" y2="270"/>
    <line x1="20" y1="375" x2="740" y2="375"/>
  </g>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="36" cy="100" r="14" fill="#6b7280"/><text x="36" y="105.5">1</text>
    <circle cx="36" cy="205" r="14" fill="#6b7280"/><text x="36" y="210.5">2</text>
    <circle cx="36" cy="310" r="14" fill="#6b7280"/><text x="36" y="315.5">3</text>
    <circle cx="36" cy="415" r="14" fill="#6b7280"/><text x="36" y="420.5">4</text>
  </g>

  <!-- 1단계: P1 Prepare(1) 성공 -->
  <line x1="190" y1="105" x2="398" y2="105" stroke="#2f6fdb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="h" x="295" y="94" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle">Prepare(1)</text>
  <text x="440" y="110" font-size="13" fill="#4b5563">약속 받음 (아직 Accept 전)</text>

  <!-- 2단계: P2 Prepare(2), P1 Accept(1) 거절 -->
  <line x1="610" y1="180" x2="402" y2="180" stroke="#d9822b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text class="h" x="505" y="169" font-size="14" font-weight="700" fill="#d9822b" text-anchor="middle">Prepare(2)</text>
  <line x1="190" y1="235" x2="355" y2="235" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text class="h" x="272" y="224" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Accept(1)</text>
  <text x="372" y="242" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">✕</text>
  <text x="430" y="241" font-size="13" fill="#c0392b">거절 (이미 2를 약속함)</text>

  <!-- 3단계: P1 Prepare(3), P2 Accept(2) 거절 -->
  <line x1="190" y1="285" x2="398" y2="285" stroke="#2f6fdb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="h" x="295" y="274" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle">Prepare(3)</text>
  <line x1="610" y1="340" x2="445" y2="340" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text class="h" x="528" y="329" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Accept(2)</text>
  <text x="428" y="347" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">✕</text>
  <text x="385" y="346" font-size="13" fill="#c0392b" text-anchor="end">거절 (이미 3을 약속함)</text>

  <!-- 4단계: P2 Prepare(4), P1 Accept(3) 거절 -->
  <line x1="610" y1="390" x2="402" y2="390" stroke="#d9822b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text class="h" x="505" y="379" font-size="14" font-weight="700" fill="#d9822b" text-anchor="middle">Prepare(4)</text>
  <line x1="190" y1="445" x2="355" y2="445" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text class="h" x="272" y="434" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Accept(3)</text>
  <text x="372" y="452" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">✕</text>
  <text x="430" y="451" font-size="13" fill="#c0392b">거절 (이미 4를 약속함)</text>

  <!-- 마무리 -->
  <rect x="180" y="492" width="400" height="44" rx="10" fill="#f6f7f8" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="380" y="520" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">…번호만 계속 오른다 (5, 6, 7 …)</text>
</svg>
