<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" role="img" aria-label="적대자가 메시지 e를 다른 이벤트들 뒤로 미루다가 마감 안에 배달하는 동안, 매 순간 상태가 갈림길로 유지되는 타임라인" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="ad" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1f2328"/></marker>
    <linearGradient id="bi" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#e8f0fc"/><stop offset="0.5" stop-color="#fdf1e3"/></linearGradient>
    <style>
      .h { paint-order: stroke; stroke: #ffffff; stroke-width: 9; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <text x="380" y="34" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">매 순간의 상태: 계속 갈림길</text>
  <line x1="70" y1="80" x2="640" y2="80" stroke="#9ca3af" stroke-width="2"/>
  <g fill="url(#bi)" stroke="#6b7280" stroke-width="2">
    <circle cx="70" cy="80" r="16"/>
    <circle cx="160" cy="80" r="16"/>
    <circle cx="250" cy="80" r="16"/>
    <circle cx="340" cy="80" r="16"/>
    <circle cx="430" cy="80" r="16"/>
    <circle cx="520" cy="80" r="16"/>
    <circle cx="640" cy="80" r="16"/>
  </g>

  <!-- 세로 점선 -->
  <g stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="70" y1="100" x2="70" y2="283"/>
    <line x1="160" y1="100" x2="160" y2="283"/>
    <line x1="250" y1="100" x2="250" y2="283"/>
    <line x1="340" y1="100" x2="340" y2="283"/>
    <line x1="430" y1="100" x2="430" y2="283"/>
    <line x1="520" y1="100" x2="520" y2="283"/>
    <line x1="640" y1="100" x2="640" y2="283"/>
  </g>

  <!-- 마감 -->
  <line x1="700" y1="120" x2="700" y2="300" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="700" y="112" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">마감</text>

  <!-- e가 밀리는 구간 -->
  <line x1="74" y1="190" x2="634" y2="190" stroke="#1f2328" stroke-width="3" marker-end="url(#ad)"/>
  <text class="h" x="355" y="180" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">e는 계속 뒤로 밀린다</text>

  <!-- 시간축 -->
  <line x1="40" y1="290" x2="740" y2="290" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="736" y="314" font-size="14" font-weight="700" fill="#6b7280" text-anchor="end">step</text>

  <!-- 이벤트 -->
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="2">
    <circle cx="160" cy="290" r="8"/>
    <circle cx="250" cy="290" r="8"/>
    <circle cx="340" cy="290" r="8"/>
    <circle cx="430" cy="290" r="8"/>
    <circle cx="520" cy="290" r="8"/>
  </g>
  <circle cx="70" cy="290" r="8" fill="#1f2328"/>
  <circle cx="640" cy="290" r="10" fill="#1f2328"/>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#4b5563">
    <text x="160" y="318">x1</text>
    <text x="250" y="318">x2</text>
    <text x="340" y="318">x3</text>
    <text x="430" y="318">x4</text>
    <text x="520" y="318">x5</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">
    <text x="70" y="318">e 도착</text>
    <text x="640" y="318">e 배달</text>
  </g>

  <!-- 범례 -->
  <g font-size="14" fill="#1f2328">
    <circle cx="90" cy="362" r="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="106" y="367">적대자가 e 앞에 끼워 넣은 다른 이벤트</text>
    <circle cx="420" cy="362" r="9" fill="#1f2328"/>
    <text x="436" y="367">결정으로 이어질 메시지 e</text>
  </g>

  <text x="380" y="412" font-size="15" fill="#4b5563" text-anchor="middle">e를 미루되 마감 안에는 배달하고, e를 처리한 뒤에도 갈림길이 남는다</text>
</svg>
